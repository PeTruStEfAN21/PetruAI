name = "python_tracker"
prompt = """Build an issue tracker in Python 3.11+ (standard library only) as the package `tracker/` at the project root. The acceptance tests are tests/test_models.py, tests/test_workflow.py, tests/test_query.py, tests/test_storage.py, tests/test_reports.py and tests/test_cli.py; do not change them or pyproject.toml. Exact messages are in the tests; every error message below is str(error).

Public API, importable from `tracker`:
- Errors: `TrackerError` (base) with subclasses `NotFoundError`, `DuplicateError`, `ValidationError`, `TransitionError`, `CycleError(path)` (attribute `path`, message "dependency cycle: A-1 -> A-2 -> A-1"), `StorageError`, `QuerySyntaxError(message, position=None)` (attribute `position`, the offset of the bad token).
- `STATUSES` = ("open", "in_progress", "review", "done", "wontfix"); `CLOSED_STATUSES` = {"done", "wontfix"}; `PRIORITY_NAMES` = ("none", "low", "medium", "high", "urgent") for 0-4. `parse_priority(value)` takes an int, a name (case-insensitive) or a digit string ("invalid priority 'x'", "priority must be between 0 and 4"); `priority_name(n)`. Status names are case-insensitive everywhere ("unknown status 'x'", a ValidationError).
- Dataclasses `User(username, name, email=None)`, `Project(key, name)`, `Comment(id, author, body, created)`, frozen `AuditEntry(seq, at, actor, action, key, detail)` and `Issue(project, number, title, reporter, description="", status="open", priority=2, assignee=None, labels=[], depends_on=[], comments=[], created=0, updated=0)` with properties `key` ("WEB-1") and `is_closed`. Issues sort by (project, number); labels and depends_on are kept sorted (keys numerically: WEB-2 before WEB-10).
- `Config(default_priority=2, wip_limit=None, require_unblocked=True)` (frozen) and `load_config(path)`: reads the [tracker] table of a TOML file; a missing file gives the defaults; errors are ValidationError: "unknown config key 'x'", "config key 'wip_limit' must be a positive integer", "config key 'require_unblocked' must be a boolean", "invalid config file '<name>'"; default_priority accepts a priority name.
- `next_statuses(status)`: the workflow is open -> in_progress, wontfix; in_progress -> open, review, wontfix; review -> in_progress, done; done -> open; wontfix -> open.
- `Tracker(path, *, clock=None, config=None)`: `clock()` returns an int timestamp (default int(time.time())), called once per change; the whole state is saved to the JSON file at `path` after every successful change (failed calls change nothing).
  - add_user(username, name, *, email=None, by="system"): username matches [a-z][a-z0-9_]{1,15}, email has the shape x@y.z, name not blank ("name must not be empty"); user(username), users() sorted. add_project(key, name, *, by="system"): key matches [A-Z][A-Z0-9]{1,9}; project(key), projects() sorted. Messages: "invalid username 'x'", "invalid email 'x'", "invalid project key 'x'", "user 'ana' already exists", "project 'WEB' already exists", "unknown user 'x'", "unknown project 'X'".
  - create_issue(project, title, *, reporter, description="", priority=None (config default), labels=(), assignee=None): numbers are per project starting at 1; the title and description are stripped (title not blank, at most 200 characters: "title must not be empty", "title is longer than 200 characters"); labels match [a-z0-9][a-z0-9-]{0,29} ("invalid label 'x'"), duplicates dropped; reporter and assignee must be users; created = updated = the clock value.
  - issue(key) ("unknown issue 'WEB-7'", a malformed key raises ValidationError "invalid issue key 'x'"); issues(project=None).
  - edit(key, *, title=None, description=None, by), assign(key, username_or_None, *, by), transition(key, status, *, by), set_priority(key, priority, *, by), add_label(key, label, *, by) (adding an existing label does nothing), remove_label(key, label, *, by) ("WEB-1 has no label 'ui'"), comment(key, body, *, by) -> Comment (ids 1, 2, ... per issue; by must be a user; "comment must not be empty"). A call that changes nothing records nothing. Every change sets issue.updated.
  - Transitions: "WEB-1 is already open", "cannot move WEB-1 from open to done", moving to in_progress needs an assignee ("cannot start WEB-1: no assignee") and, with config.wip_limit, fewer than wip_limit other in_progress issues for that assignee ("wip limit reached for ana"); moving to done needs every dependency closed when config.require_unblocked ("WEB-1 is blocked by WEB-2, WEB-3").
  - add_dependency(key, other, *, by) ("WEB-1 already depends on WEB-2", self or cycle -> CycleError with path [key, other, ..., key], found by depth-first search over dependencies in key order), remove_dependency ("WEB-1 does not depend on WEB-2"), blockers(key) = open dependencies, dependents(key), work_order(project) = the open issues of the project in topological order (open dependencies first; among ready issues higher priority first, then lower number; closed dependencies are ignored).
  - search(query) -> issues; audit(key=None) -> AuditEntry list. seq starts at 1, `at` is the clock value of the change. Actions and details: user (key None, detail username), project (detail key), create (actor = reporter, detail title), edit ("title", "description" or "title,description"), assign (username or "none"), status ("open -> in_progress"), priority ("2 -> 4"), label ("+bug" / "-bug"), comment (comment id), depend ("+WEB-2" / "-WEB-2").
- Search language (`tracker.query`: `tokenize(text)` -> tokens with kind, value, pos; `parse(text)` -> Query with `filter` (None when empty) and `sort` (tuple of (field, descending))): terms separated by spaces are ANDed; `OR` (upper case) binds looser than AND; parentheses group; a leading `-` negates a term, phrase or group. Free text (a word or a "quoted phrase") matches title or description, case-insensitively. Fields: status:a,b; is:open / is:closed; label:a,b; assignee:a,b (none = unassigned); reporter:x; project:WEB (case-insensitive); priority with :, =, >, >=, <, <= and a number or name. sort:f1,-f2 with priority, created, updated, key, status (workflow order), title; results are in key order, then sorted stably by the sort keys. Token kinds are NOT, LPAREN, RPAREN, OR, TEXT and TERM (value (field, op, raw value), a word like name:value or name>=value). Errors (QuerySyntaxError): "unknown field 'x'", "unterminated quote", "unbalanced parentheses", "invalid priority 'x'", "operator '>' is not allowed for 'label'", "unknown status 'x'", "sort is only allowed at the top level" (inside parentheses or negated), "unknown sort field 'x'", "expected a term", "missing value for 'label'", "invalid value 'x' for 'is'".
- Storage (`tracker.storage`): `SCHEMA_VERSION` = 2; the file is one JSON object with exactly the keys schema, users, projects, counters (last issue number per project), issues (the Issue fields, without key) and audit; it is written atomically (temporary file in the same folder, then rename; no temporary file may stay behind) and parent folders are created. A missing file is an empty tracker. "corrupt data file" for bad JSON, a non-object or bad records; "unsupported schema 3" (or None when neither "schema" nor "version" exists). `migrate(data)` returns schema 2 data unchanged and converts version 1 files: {"version": 1, "users": {username: name}, "projects": {key: name}, "issues": [{"id": "WEB-1", "title", "state": "open"|"closed", "assignee", "tags", "priority": name, "reporter", optional "blocked_by"}]} -> closed becomes done, tags become lower-case sorted labels, counters are the highest number per project (0 for empty projects), empty audit. A v1 file is migrated in memory and written as schema 2 on the next change.
- Reports (`tracker.reports`): by_assignee(issues) and by_label(issues) -> {name: {"open": n, "closed": n}} sorted by name, unassigned issues under "(unassigned)" last; by_status(issues) -> {status: count} for every status in workflow order; render_table(headers, rows): columns two spaces apart, a dashed rule as wide as each column under the header, ints right-aligned, trailing spaces stripped, no final newline.
- Export (`tracker.export`): to_csv(issues): header key,title,status,priority,assignee,labels, labels joined by ";", "\\n" line endings. to_markdown(issues): "| Key | Title | Status | Priority | Assignee | Labels |", "|---|---|---|---|---|---|", one row per issue with the priority name and labels joined by ", ", "|" escaped as "\\|", empty cells "-", ending with a newline.
- CLI (`tracker.cli.main(argv=None) -> int`, also `python -m tracker`): global options --db PATH (default $TRACKER_DB, else tracker.json), --config PATH, --as USER (default "system"; the reporter of new issues and the actor of changes). Commands: user add USERNAME NAME [--email E] / user list; project add KEY NAME / project list; new PROJECT TITLE [--priority P] [--label L]... [--assignee U] [--description D] (prints the key); assign KEY USER|none; move KEY STATUS; label KEY LABEL [--remove]; comment KEY BODY; depend KEY OTHER [--remove]; show KEY; list [QUERY...]; order PROJECT; report assignees|labels|status [--project P]; export csv|markdown [QUERY...] [--output FILE]; log [KEY]. Output formats are in tests/test_cli.py (an issue line is "WEB-1 [open] (high) Login @bob #bug #ui"). A TrackerError prints "error: <message>" to stderr and returns 1; usage errors exit with 2 (argparse).

Split the code into subpackages and modules: tracker/errors.py, config.py, validators.py; tracker/models/ (enums.py, entities.py, issue.py); tracker/core/ (workflow.py, dependencies.py, service.py); tracker/query/ (tokenizer.py, ast.py, parser.py, evaluator.py); tracker/storage/ (jsonfile.py, codec.py, migrations.py); tracker/reports/ (stats.py, table.py); tracker/export/ (csv_export.py, markdown.py); tracker/cli/ (formatting.py, commands.py, main.py); plus tracker/__main__.py."""
answers = [
    "Keep the API exactly as the prompt and the tests use it, with the module layout given at the end of the prompt.",
    "Standard library only (dataclasses, json, tomllib, argparse, csv, heapq); a recursive descent parser for the queries and an atomic write through a temporary file plus os.replace.",
    "Work test-first one test file at a time, starting with models and workflow, and run run_checks until every test passes.",
]
seed = "seed"
protect = ["tests/test_models.py", "tests/test_workflow.py", "tests/test_query.py", "tests/test_storage.py", "tests/test_reports.py", "tests/test_cli.py", "pyproject.toml"]
forbid = ["conftest.py", "**/conftest.py", "pytest.ini", "tox.ini", "setup.cfg", "jest.config.*", "babel.config.*", "Directory.Build.*"]
setup = []
checks = []
tier = "quality"
eval = false
