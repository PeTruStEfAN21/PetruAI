# Trajectory generation. Paths are relative to training/.
tasks_dir = "tasks"
out = "data/trajectories.jsonl"
tier = "quality"            # teacher: the 35B MoE (experts in RAM); ~3x slower than the 9B, better work
samples_per_task = 3
attempts_per_task = 4
max_tokens = 0              # no limit: the user wants every verified example, however long
max_minutes = 240           # total budget for the step (the night caps it at a third of its time)
attempt_timeout_s = 3600    # one attempt is killed (whole process tree) after an hour
