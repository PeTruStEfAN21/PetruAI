[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petru"
version = "0.1.0"
description = "PetruAI: local-first terminal coding agent"
requires-python = ">=3.14"
dependencies = [
  "openai>=1.60",
  "prompt_toolkit>=3.0",
  "rich>=13",
  "jsonschema>=4",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-language-pack>=1.22,<2",
  "sqlite-vec>=0.1.9,<0.2",
  "watchdog>=6,<7",
]


[project.scripts]
petru = "petru.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["petru"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs the real llama-server and models"]
addopts = "-m 'not e2e'"
